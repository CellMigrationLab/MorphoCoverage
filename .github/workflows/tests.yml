name: tests

# What runs, and when (owner, 2026-10-05: keep GitHub minutes low):
# - every pull request: lint, then the suite without the slow tests, on Python 3.11 only;
#   a newer push to the same pull request cancels the run still going;
# - nothing on a push to main: a merge only lands code its pull request already tested;
# - weekly, and on demand (Actions tab, "Run workflow"): the whole suite on 3.11 and 3.13.
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff (the version pinned in pyproject.toml)
        run: python -m pip install "ruff==0.16.8"
      - name: Lint
        run: python -m ruff check src tests data
      - name: Format
        run: python -m ruff format --check src tests data

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.11"]') || fromJSON('["3.11", "3.13"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests (pull request, without the slow tests)
        if: github.event_name == 'pull_request'
        run: pytest -m "not network and not slow"
      - name: Tests (everything)
        if: github.event_name != 'pull_request'
        run: pytest
