name: tests

# Minimal on GitHub (owner, 2026-10-05): the whole suite runs locally before every push, so a
# pull request only checks lint, formatting, that the package installs and imports, and the
# guard tests (module size, type hints). A newer push to the same pull request cancels the run
# still going; nothing runs on a push to main. The whole suite runs only on demand (Actions
# tab, "Run workflow").
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the whole suite"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests data
      - name: Format
        run: python -m ruff format --check src tests data
      - name: Import
        run: python -c "import morphocoverage, morphocoverage.workflows, morphocoverage.retrospective"
      - name: Guard tests
        run: pytest -n 0 tests/test_guards.py
      - name: Whole suite (on demand)
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: pytest
