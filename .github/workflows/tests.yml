name: tests

# Minimal on GitHub (owner, 2026-10-05): the whole suite runs locally before every push, so a
# pull request only checks lint, formatting, that the package installs and imports, the guard
# tests (module size, type hints, the function index and its ratchets) and that the ratchet
# baselines only tightened against the base branch (audit 12). A newer push to the same pull
# request cancels the run still going; nothing runs on a push to main. The whole suite runs
# only on demand (Actions tab, "Run workflow").
on:
  pull_request:
    # Documentation alone skips the run, except the generated function index and duplicate
    # list, which the guard tests check (later patterns win).
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/common/function_index.jsonl"
      - "docs/common/function_duplicates.json"
      # The vendored Spec copy is checked byte for byte, its Markdown files included.
      - "tests/spec_fixtures/**"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the whole suite"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-pin:
    # The vendored Spec test material (tests/spec_fixtures, docs/vendoring.md of the Spec) must be
    # what the Spec has at the commit PIN.toml names: vendor.py --check changes nothing and names
    # each difference. tests/test_spec_pin.py proves offline that the copy hashes to PIN.toml
    # (it runs with the whole suite); this job proves PIN.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the Spec (full history, to find the pinned commit)
        uses: actions/checkout@v4
        with:
          repository: CellMigrationLab/MorphoBricks-Spec
          path: spec
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The vendored copy is the Spec at its pinned commit
        run: python spec/tools/vendor.py --into . --check
      - name: The copy hashes to its PIN.toml (offline pin test)
        run: python -m pip install pytest && python -m pytest -p no:cacheprovider --noconftest -o addopts="" tests/test_spec_pin.py

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The pull request's merge commit and its first parent, the base branch.
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests data
      - name: Format
        run: python -m ruff format --check src tests data
      - name: Import
        run: python -c "import morphocoverage, morphocoverage.workflows, morphocoverage.retrospective"
      - name: Guard tests
        run: pytest -n 0 tests/test_guards.py tests/test_function_guards.py tests/test_function_tools.py
      - name: Baselines only tighten
        if: github.event_name == 'pull_request'
        run: python tools/audit.py --check-against HEAD^1
      - name: Whole suite (on demand)
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: pytest
