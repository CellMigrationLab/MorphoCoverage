[[claims]]
figure = "Fig. 5E (area)"
claim = "CCT8 silencing made MDA-MB-231 cells on CDM smaller"
quote = "CCT8 knockdown led to smaller, more rounded cells (Fig. 5D and 5E), consistent with impaired protrusive activity."
quote_source = "Results, owner's manuscript copy"
stated_n = "n > 53 cells per condition, three biological repeats"
stated_test = "randomization test (Cohen's d, 10,000 iterations), Bonferroni-corrected"
direction = "decrease"
reproduction = { status = "partly", value = "mean area 419 (siCCT8#5) and 404 (siCCT8#8) against 533 um^2 (siCTRL); Cohen's d 0.4362 and 0.5682, identical to the deposit's Stats table; Bonferroni-corrected randomization p 0.061 (siCCT8#5) and 0.0084 (siCCT8#8) in that table", note = "both siRNAs are smaller in each of the 3 repeats, but siCCT8#5 does not reach p < 0.05 after the correction (0.056 on the repeat-normalised area). To discuss with the owner; not a correction of the paper." }

[[claims]]
