[[claims]]
figure = "Fig. 2C"
claim = "Silencing MINK1, CSNK1A1, SCRIB or CCT8 reduced the number of MYO10-positive filopodia per cell"
quote = "depletion of MINK1 (~80% efficiency), CSNK1A1 (~80% efficiency), SCRIB (~80–90% efficiency), or CCT8 (~75% efficiency) significantly reduced the number of MYO10-positive filopodia (Fig. 2B and 2C)."
quote_source = "Results, owner's manuscript copy"
stated_n = "n = 76-113 cells per condition, three biological repeats; the siCTRL condition pools data from 6 experimental sets"
stated_test = "randomization test (Cohen's d, 10,000 iterations), Bonferroni-corrected, against pooled siCTRL"
direction = "decrease"
reproduction = { status = "match", value = "all 8 siRNAs: Cohen's d 0.51-1.24 against pooled siCTRL, identical to the deposit's Stats table to 4 decimals; randomization p < 1e-4 for each; means 30.6-45.5 against 56.9", note = "also lower than their own set's siCTRL in every one of the 3 repeats" }

[[claims]]
figure = "Fig. 2C"
claim = "Silencing MAP4K4 or NF2 did not significantly alter filopodia number"
quote = "While silencing MAP4K4 (~85% efficiency) or NF2 (~87% efficiency) did not significantly alter filopodia number"
quote_source = "Results, owner's manuscript copy"
stated_n = "as above"
stated_test = "as above"
direction = "no change"
reproduction = { status = "partly", value = "siMAP4K4#5 d 0.10 (Bonferroni p 1.0), siNF2#7 d 0.23 and siNF2#17 d 0.19 (Bonferroni p 1.0): no significant change against pooled siCTRL; but siMAP4K4#6 d 0.50, mean 68.2 against 56.9, Bonferroni p 0.0078 (an increase), as in the deposit's Stats table", note = "the claim holds if a hit needs both siRNAs; against each set's own siCTRL, both MAP4K4 siRNAs and both NF2 siRNAs are higher in all 3 repeats (MAP4K4 set siCTRL mean 42.0 against the pooled 56.9). To discuss with the owner; not a correction of the paper." }

[[claims]]
figure = "Fig. 2C (legend)"
claim = "Cell counts per condition and pooled control"
quote = "n = 76-113 cells per condition, three biological repeats); the siCTRL condition pools data from 6 experimental sets."
quote_source = "Fig. 2 legend, owner's manuscript copy"
stated_n = "76-113 cells per condition"
stated_test = ""
direction = ""
reproduction = { status = "match", value = "76-113 cells per siRNA; 555 pooled siCTRL cells; 3 repeats in every set; counts, means and SDs identical to the deposit's summary table", note = "" }

[hypotheses]
written = "2026-09-30, before any MorphoCoverage run"
items = [
  "Within each set and repeat, the per-cell rules should judge the counts precise with few cells: the per-object JCB rule at 5% should be met in every condition and repeat.",
  "With fields = cells, the field-level design effect should be about 1, so objects and fields should agree (no clustering by construction).",
  "The condition contrast (each siRNA against its own set's siCTRL, within each repeat) cannot be tested: one coverslip per siRNA and repeat (one unit per side). MorphoCoverage should say so, and report effect sizes and their direction per repeat instead.",
  "Direction per repeat: decreases for CCT8, CSNK1A1, MINK1 and SCRIB in 3/3 repeats; increases for MAP4K4 and NF2 in 3/3 repeats against their own set's control.",
  "Pooling siCTRL across sets (as the figure does) hides the set-to-set difference in control level (42-65 filopodia per cell); the per-set pairing should expose it.",
]

[[caveats]]
text = "One cell per field is the owner's statement; the images and their names are not in the deposit, so field identities are synthetic."
[[caveats]]
text = "One coverslip per siRNA and repeat (technical repeat 'single'): no test within a biological repeat is possible; cells are not independent replicates."
[[caveats]]
text = "Cells were chosen by the operator and counted manually (the paper states no selection rule): a chosen, not random, sample of cells."
[[caveats]]
text = "Counts are integers (7-178): quantized features can trip exact-copy and novelty checks by coincidence."
[[caveats]]
text = "The figure pools siCTRL across the six sets; these tables keep each set's control, so numbers against 'the control' depend on the choice."
