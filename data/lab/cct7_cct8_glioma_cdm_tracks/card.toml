[biology]
cells = "U-87 MG glioblastoma cells migrating on cell-derived matrices (CDMs)"
conditions = "siCTRL and two siRNAs against each of CCT7 (siCCT7#3, siCCT7#6) and CCT8 (siCCT8#5, siCCT8#8)"
control = "one siCTRL well per experimental set and repeat (source labels siCTRL_CCT7, siCTRL_CCT8)"
positive_control = "none declared"
human_material = "established cell line (U-87 MG, ATCC HTB-14); no patient-derived material"
animal_material = "none"
ethics_statement = "not applicable"
identifiers_screened = "yes: the tables hold siRNA names, well and position names, repeat numbers and track metrics only"

[acquisition]
microscope = { value = "CellIQ, 10x objective, brightfield, a frame every 10 min (the results file names say 'px per 10min')", quote = "For cell migration analyses, U-87 MG or MDA-MB-231 cells were seeded onto CDMs for 4 hours prior to imaging. Brightfield images were taken every 10 minutes over 16 hours using a CellIQ system with a 10× objective at 37°C and 5% CO2.", source = "Methods of the related paper (owner's manuscript copy); that these data follow it is an assumption" }
tracking = { value = "manual tracking in Fiji, metrics from CellTracksColab (the column names are CellTracksColab's)", quote = "Cell tracking was performed manually using Fiji’s Manual Tracking plugin to assess cell migration (Schindelin et al., 2012). Only cells that met the following criteria were included: (i) not dividing during the imaging period, (ii) not colliding with other cells, and (iii) not completely immobile during the imaging period.", source = "Methods of the related paper; assumed to apply" }
field_selection = "not stated (positions within each well; how they were chosen is not recorded)"
fields = "one results file per imaged position: '<well>_<position>', 5-9 positions per well"
stage_coordinates = "not recorded"
acquisition_order = "not recorded"
concurrent_acquisition = "yes: time-lapse of several positions and wells on one plate (CellIQ); fields were imaged in parallel, so acquisition-order, replay and live uses do not apply"
units = "distances in pixels and speeds in px per 10 min (the pixel size is not recorded); Track Duration in min"

[analysis_in_paper]
pipeline = "not in a paper; tracks as exported by CellTracksColab"
filters = "the related paper's criteria (not dividing, not colliding, not immobile), assumed"
normalisation = "none"

[design]
experiment = "the experimental set, CCT7 or CCT8 (from the siRNA label); each has its own siCTRL well (B4 for CCT7, B1 for CCT8)"
condition = "the siRNA; both controls written 'siCTRL', the source label kept as source_condition"
biological_repeat = "'<set>_<Repeat>' (Repeat 1-3): the two sets' movies have different lengths in every repeat (tracks of about 950 min for CCT7, 1200-1440 min for CCT8), and they were separate acquisitions (owner's statement, 2026-09-30)"
technical_repeat = "the well (B1-B6), one well per siRNA per repeat; rules out any test that needs several wells within a biological repeat"
field = "the imaged position, '<well>_<position>' from the results file name (e.g. 'B5_04-1'), verbatim"
observation = "one track; label_id = TRACK_ID (the track's number within its results file)"
fov_table_source = "the results files named in the source (one per position); positions with no track are not known"
non_features = [
  "label_id", "Track Duration", "Min Speed", "Max Speed", "Total Distance Traveled", "Directionality",
  "Tortuosity", "Total Turning Angle", "Spatial Coverage", "FMI_x_plus", "FMI_x_minus",
  "FMI_y_plus", "FMI_y_minus", "source_row",
]
feature_choice = "feature_cols are the metrics that do not grow with the track's length: the speeds (rates per frame) and CellTracksColab's rolling-window metrics. Track durations differ between conditions within a repeat, which should be flagged but is not a deal breaker as long as the normalised metrics are used (owner's statement, 2026-09-30); so the whole-track metrics (Max Speed, Total Distance Traveled, Directionality, Tortuosity, Total Turning Angle, Spatial Coverage) are stored as non-features, with Track Duration, Min Speed (two distinct values, 0 and 0.0724) and the forward migration indices (FMI, which depend on the image orientation and have no gradient to refer to)"

