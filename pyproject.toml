[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morphocoverage"
version = "0.1.0"
description = "FOV-aware assessment of phenotypic sampling completeness for quantitative and smart microscopy."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "CellMigrationLab"}]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "umap-learn>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "ruff==0.16.8"]
# The benchmark's comparators (data/simulations/decisions, docs/common/validation.md): never
# imported by the package. harmonypy is GPL-3.0, used only as a reference by those scripts.
validation = ["statsmodels>=0.14", "harmonypy>=0.0.9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The plotly.js bundle the HTML report embeds (workflows/assets/README.md).
"morphocoverage.workflows" = ["assets/*.js", "assets/PLOTLY_LICENSE", "assets/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# Test files run in parallel on every CPU (pytest-xdist); each file stays on
# one worker so module-level data is loaded once. `pytest -n 0` runs serially.
addopts = "-n auto --dist loadfile -m 'not network'"
# Tests that download a pinned source (data/lab convert.py) run only on request: `pytest -m network`.
markers = [
    "network: downloads from a public repository (deselected by default)",
    "slow: long-running, part of the whole suite; a focused run can deselect it (-m 'not slow')",
]
# Many tests pass no FOV table on purpose; the warning that says so is checked
# where it matters (tests/test_data_check.py) with pytest.warns.
filterwarnings = ["ignore::morphocoverage.schema.MissingFovTableWarning"]

[tool.ruff]
target-version = "py311"
line-length = 100
# Byte-exact copies of MorphoBricks-Spec files (tools/vendor.py, the brick-template pin test):
# changed in the Spec only, never reformatted here (the pin test hashes the copy).
extend-exclude = ["tests/spec_fixtures", "tests/test_spec_pin.py"]

[tool.ruff.lint]
# Default rules plus the line-length limit, which `ruff format` cannot enforce
# for long strings and comments.
extend-select = ["E501"]
